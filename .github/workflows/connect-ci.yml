name: Connect CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - sparkle
  workflow_dispatch:

concurrency:
  group: connect-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jest:
    name: Connect Jest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Connect unit tests
        run: npm test --workspace=reflections-connect
